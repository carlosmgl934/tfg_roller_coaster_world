; php.ini local para el endpoint de subida de archivos
; Sobrescribe los valores del servidor de producción para este directorio.
; NOTA: Solo funciona si el servidor tiene AllowOverride con php_value
;       o si PHP-FPM está configurado con user_ini.filename = php.ini (por defecto).

upload_max_filesize = 20M
post_max_size       = 20M
memory_limit        = 256M
